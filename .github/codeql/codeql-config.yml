name: entree-carto

# CI GitHub (racine du dépôt). En local, verify:codeql utilise --source-root=./src.
paths:
  - src

paths-ignore:
  - dist
  - 'dist/**'
  - node_modules
  - 'node_modules/**'
  - coverage
  - '**/*.min.js'
  # Chunks lib (jsPDF dans worker, html2canvas dans index.es-*)
  - '**/printExport.worker-*.js'
  - '**/index.es-*.js'
  - dist/entree-carto.js
