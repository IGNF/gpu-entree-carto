# Configuration avancée CodeQL (config src/ dans .github/codeql/codeql-config.yml).
#
# Si l’upload SARIF échoue avec « default setup is enabled » :
# Réglages du dépôt → Security → Advanced Security → Code scanning →
# CodeQL analysis → « Switch to advanced » (désactive le setup par défaut).
# Doc : https://docs.github.com/en/code-security/code-scanning/troubleshooting-code-scanning/sarif-uploads#default-setup-enabled
name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    paths:
      - 'src/**'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '30 5 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Échec SARIF « default setup is enabled » → Settings → Code scanning → Switch to advanced
      # (voir .github/codeql/README.md)

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
