name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint, format, types
        run: npm run verify
      - name: Tests
        run: npm run test
      - name: Build (démo + bundles)
        run: npm run build
      - name: Contrôle des bundles (eval, sources .ts)
        run: npm run verify:dist
