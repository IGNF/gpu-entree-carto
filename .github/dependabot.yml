version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Migrations majeures à planifier (PR Dependabot à fermer ou traiter à part)
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      # 5.1+ : peer optional Vite ^7.3 (projet sur Vite 6) — monter vue-router avec la migration Vite
      - dependency-name: vue-router
        update-types: [version-update:semver-minor, version-update:semver-major]
      # CodeQL : is-unsafe bundlé depuis fxp 5.9+
      - dependency-name: fast-xml-parser
        versions: ['>=5.9.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
